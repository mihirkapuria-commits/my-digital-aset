<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>MyDigitAsset</title>
    <script>
      const path = window.location.pathname;
      const search = window.location.search;
      const hash = window.location.hash;

      sessionStorage.setItem(
        'redirect',
        path + search + hash
      );

      window.location.replace('/');
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
