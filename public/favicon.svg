<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="85%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="facet-top" x1="32" y1="12" x2="32" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="facet-left" x1="16" y1="26" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="facet-right" x1="48" y1="26" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <filter id="glow" x="10" y="8" width="44" height="48" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Geometric Digital Asset Crystal / Monogram -->
  <g filter="url(#glow)">
    <!-- Top Face (Hexagonal perspective) -->
    <path d="M32 14L46 22L32 30L18 22Z" fill="url(#facet-top)"/>
    
    <!-- Left Face -->
    <path d="M18 22L32 30V48L18 40Z" fill="url(#facet-left)"/>
    
    <!-- Right Face -->
    <path d="M32 30L46 22V40L32 48Z" fill="url(#facet-right)"/>
    
    <!-- Central Digital Node Inset (Letter M/D Ascending Vector) -->
    <path d="M26 27L32 23L38 27V37L32 41L26 37Z" fill="#1c1917" fill-opacity="0.7"/>
    <path d="M32 20V44" stroke="#FEF3C7" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="32" cy="32" r="3" fill="#FEF3C7"/>
  </g>
</svg>
